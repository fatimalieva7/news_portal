<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>News</title>
</head>
<body>

{% for new in news %}

<h3>{{ new.title }}</h3>
<h3>{{ new.name }}</h3>
<h3>{{ new.content }}</h3>
<img src="{{ new.image.url }}">
<h3>{{ new.category }}</h3>
<h3>{{ new.created_at }}</h3>

{% endfor %}

</body>
</html>
